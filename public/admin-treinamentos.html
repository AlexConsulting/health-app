<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel TI - Auditoria de Treinamentos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .filter-bar { background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group input, .filter-group select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .log-table { width: 100%; border-collapse: collapse; background: white; }
        .log-table th { background: #0f172a; color: white; text-align: left; padding: 12px; }
        .log-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .badge-af { background: #dbeafe; color: #1e40af; }
        .badge-rb { background: #fef9c3; color: #854d0e; }
        .badge-mb { background: #dcfce7; color: #166534; }

        /* Estilo dos novos botões */
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .btn-print { background: #dc3545; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; float: right; }
        .btn-print:hover { background: #bb2d3b; }

        /* CONFIGURAÇÃO DE IMPRESSÃO (PDF) */
        @media print {
            .filter-bar, .btn-primary, .btn-secondary, .btn-print, .header-actions, .sidebar {
                display: none !important;
            }
            .main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .card { box-shadow: none !important; border: none !important; }
            .log-table th { background: #eeeeee !important; color: black !important; border: 1px solid #ddd; }
            .log-table td { border: 1px solid #ddd; }
            body { background: white; }
        }
		
		/* Efeito Zebra na Tabela */
.log-table tbody tr:nth-child(even) {
    background-color: #f8fafc;
}

.log-table tbody tr:hover {
    background-color: #f1f5f9;
    transition: 0.2s;
}

/* Ajuste de ícones no Relatório */
.log-table td i {
    margin-right: 8px;
    color: #64748b;
}
    </style>
</head>
<body>
    <div class="app-shell">
        <main class="main-content" style="margin-left: 0; width: 100%;">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 20px;">
                  <h2><i class="fas fa-clipboard-check"></i> Relatório de Acessos - Treinamentos</h2>
                </div>

                <div class="header-actions">
                    <button onclick="carregarLogs()" class="btn-primary"><i class="fas fa-sync"></i> Atualizar</button>
                </div>
            </header>

            <section class="dashboard-grid">
                <div class="card full-width">
                    <div class="filter-bar">
                        <div class="filter-group">
                            <label>Filtrar Médico (CRM/CPF):</label>
                            <input type="text" id="filter-medico" placeholder="Ex: 12345..." oninput="filtrarTabela()">
                        </div>
                        <div class="filter-group">
                            <label>Unidade:</label>
                            <select id="filter-unidade" onchange="filtrarTabela()">
                                <option value="">Todas</option>
                                <option value="AF">AF - Arnaldo Figueiredo</option>
                                <option value="RB">RB - Rota dos Bandeirantes</option>
                                <option value="MB">MB - M. Boi</option>
                            </select>
                        </div>
                    </div>

                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Médico</th>
                                <th>Unidade</th>
                                <th>Arquivo Baixado</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>

                    <button onclick="window.print()" class="btn-print">
                        <i class="fas fa-file-pdf"></i> Gerar PDF / Imprimir Relatório
                    </button>
                </div>
            </section>
        </main>
    </div>
    <script src="js/admin-treinamentos.js"></script>
</body>
</html>
