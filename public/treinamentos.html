<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health App - Downloads de Treinamento</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .training-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .file-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-top: 4px solid #007bff;
            transition: transform 0.2s;
        }

        .file-card:hover { transform: translateY(-5px); }

        .file-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #007bff;
        }

        .file-info h4 { margin-bottom: 5px; color: #334155; }
        .file-info p { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }

        .btn-download {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-download:hover { background: #218838; }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-card input, .auth-card select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h3 style="text-align: center; margin-bottom: 20px; color: #007bff;">🔐 Acesso Restrito</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px; text-align: center;">Identifique-se para acessar os treinamentos da sua unidade.</p>
            
            <label>CRM ou CPF:</label>
            <input type="text" id="doc-medico" placeholder="Digite seu documento...">
            
            <label>Selecione sua Unidade:</label>
            <select id="select-unidade">
                <option value="">Selecione...</option>
                <option value="AF">Arnaldo Figueiredo</option>
                <option value="RB">Rota dos Bandeirantes</option>
                <option value="MB">M. Boi</option>
            </select>
            
            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="liberarAcesso()">Acessar Arquivos</button>
        </div>
    </div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">⚕️</div>
                <span>Health App</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="/dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="active"><a href="#"><i class="fas fa-file-download"></i> Treinamentos</a></li>
                    <li><a href="/meu-progresso.html"><i class="fas fa-chart-pie"></i> Meu Progresso</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="user-info">
                    <span id="display-identificacao">Aguardando Identificação...</span>
                </div>
                <div id="current-datetime" style="font-weight: 500; color: #64748b;"></div>
            </header>

            <section class="dashboard-grid">
                <div class="card operational-card full-width">
                    <h3 id="titulo-unidade"><i class="fas fa-folder-open"></i> Arquivos de Treinamento</h3>
                    <div class="training-grid" id="container-arquivos">
                        </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/treinamentos.js"></script>
</body>
</html>
