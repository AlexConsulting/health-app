<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health App - Login de Acesso</title>
    <style>
        /* --- PALETA DE CORES E VARIÁVEIS --- */
        :root {
            --color-primary: #172a4d; /* Azul Marinho */
            --color-secondary: #00cc99; /* Verde Vibrante */
            --color-text-light: #ffffff;
            --color-text-dark: #333333;
            --color-background-card: #f8f9fa;
        }

        /* --- RESET E CENTRALIZAÇÃO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--color-primary);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;             /* Ativa o Flexbox */
            justify-content: center;    /* Centraliza na horizontal */
            align-items: center;        /* Centraliza na vertical */
            padding: 20px;
        }

        /* --- CONTAINER DE LOGIN (PROFISSIONAL) --- */
        .login-container {
            background-color: var(--color-text-light);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--color-primary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.9rem;
        }

        /* --- FORMULÁRIO E INPUTS --- */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        /* Padronização que você enviou */
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            background-color: #fff;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--color-secondary);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 204, 153, 0.2);
        }

        /* --- BOTÃO --- */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--color-secondary);
            color: var(--color-text-light);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #00b386;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 204, 153, 0.3);
        }

        /* --- AÇÕES SECUNDÁRIAS --- */
        .secondary-actions {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .secondary-actions a {
            text-decoration: none;
            color: var(--color-primary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .secondary-actions a:hover {
            text-decoration: underline;
        }

        /* --- MENSAGENS DE STATUS --- */
        #message-area {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }

        /* --- ESTILOS DO MODAL (MANTIDOS CONFORME SOLICITADO) --- */
        .modal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #fff; padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 90%;
            max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative;
        }
        /* ... demais estilos de modal e filtros permanecem ativos no seu CSS global ... */
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="header">
            <div class="logo-icon">⚕️</div>
            <h1>Health App</h1>
            <p>Acesso ao Painel Operacional</p>
        </div>

        <div id="message-area"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="admin@admin.app" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="senha" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">
                Acessar Dashboard
            </button>
        </form>

        <div class="secondary-actions">
            <a href="#" id="reset-link">Esqueci minha senha</a>
            <a href="#" id="register-link">Cadastrar novo usuário</a>
        </div>
        
    </div>

    <script src="js/login.js"></script>
</body>
</html>
