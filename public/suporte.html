<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte TI - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; margin: 0; }

        /* Container Principal com altura fixa */
        #chat-container {
            width: 350px; 
            height: 500px; 
            position: fixed; 
            bottom: 20px; 
            right: 20px;
            background: #fff; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border-radius: 15px; 
            z-index: 9999; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Área de Login */
        #login-area { padding: 30px; text-align: center; }
        #login-area input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #login-area button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Área de Chat */
        #chat-area { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
        }

        /* Cabeçalho */
        #chat-header { 
            background: #007bff; 
            color: white; 
            padding: 15px; 
            font-weight: bold; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0; 
        }

        /* Caixa de Mensagens */
        #mensagens-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            background: #f9f9f9; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        /* Estilo dos Balões */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-usuario { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-ti { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }

        /* Rodapé */
        .input-group { 
            display: flex; 
            padding: 12px; 
            background: #fff; 
            border-top: 1px solid #eee; 
            align-items: center;
            flex-shrink: 0; 
        }
        #msg-input { flex: 1; border: 1px solid #ddd; padding: 10px 15px; border-radius: 20px; outline: none; }
        .btn-enviar { 
            background: #007bff; 
            color: white; 
            border: none; 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            margin-left: 8px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="login-area">
        <i class="fas fa-headset" style="font-size: 3rem; color: #007bff; margin-bottom: 10px;"></i>
        <h3>Suporte TI</h3>
        <input type="text" id="nome-usuario" placeholder="Seu nome completo...">
        <button id="btn-iniciar">Iniciar Conversa</button>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <span><i class="fas fa-circle" style="color: #28a745; font-size: 10px;"></i> Atendimento Ativo</span>
            <i class="fas fa-times" style="cursor: pointer;" onclick="location.reload()" title="Fechar Chat"></i>
        </div>
        <div id="mensagens-box"></div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="Digite sua mensagem...">
            <button class="btn-enviar" id="btn-enviar"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    window.onload = () => {
        // Inicializa o socket com o path configurado no server.js
        const socket = io({ path: '/socket.io-handler/' });
        let sessaoId = null;

        const btnIniciar = document.getElementById('btn-iniciar');
        const btnEnviar = document.getElementById('btn-enviar');
        const inputMsg = document.getElementById('msg-input');
        const box = document.getElementById('mensagens-box');

        // Função auxiliar para renderizar mensagens (centraliza a lógica para evitar repetição)
        function renderizarMensagem(data) {
            const div = document.createElement('div');
            div.className = `msg ${data.remetente === 'usuario' ? 'msg-usuario' : 'msg-ti'}`;
            
            // Formatação do nome do remetente
            const label = data.remetente === 'usuario' ? 'Você' : 'Suporte TI';
            div.innerHTML = `<strong>${label}:</strong><br>${data.mensagem}`;
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Evento de Início de Chat
        btnIniciar.onclick = () => {
            const nome = document.getElementById('nome-usuario').value.trim();
            if (nome.length < 3) return alert("Por favor, digite seu nome completo.");
            
            socket.emit('iniciar_sessao', nome);
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            inputMsg.focus();
        };

        // Recebe o ID da sessão do servidor e tenta carregar mensagens antigas se houver
        socket.on('sessao_criada', async (id) => { 
            sessaoId = id; 
            console.log("Conectado na Sessão:", sessaoId);

            // Tenta buscar o histórico no banco de dados para o usuário não perder a conversa se a página oscilar
            try {
                const response = await fetch(`/api/suporte/mensagens/${sessaoId}`);
                const mensagens = await response.json();
                if (Array.isArray(mensagens)) {
                    box.innerHTML = ''; // Limpa antes de carregar
                    mensagens.forEach(msg => renderizarMensagem(msg));
                }
            } catch (err) {
                console.error("Erro ao recuperar histórico inicial:", err);
            }
        });

        // Função de Envio
        const enviar = () => {
            const msg = inputMsg.value.trim();
            if (msg && sessaoId) {
                socket.emit('enviar_mensagem', { 
                    sessao_id: sessaoId, 
                    remetente: 'usuario', 
                    mensagem: msg 
                });
                inputMsg.value = '';
            }
        };

        btnEnviar.onclick = enviar;
        inputMsg.onkeypress = (e) => { if (e.key === 'Enter') enviar(); };

        // Receber e filtrar mensagens em tempo real
        socket.on('nova_mensagem', (data) => {
            // Só exibe se a mensagem pertencer a esta sessão específica (Filtro de segurança)
            if (data.sessao_id == sessaoId) {
                renderizarMensagem(data);
            }
        });

        // Tratamento de erros de conexão
        socket.on('connect_error', () => {
            console.error("Erro ao conectar ao servidor de chat.");
        });
    };
</script>
</body>
</html>
